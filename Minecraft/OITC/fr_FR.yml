  Game-Death-Format: "&7[&4CHAT DES MORTS&7] &r"
  Game-Items:
    Leave-Item:
      Returning-Lobby: "&a&lTéléportation vers le lobby dans 3 secondes...\n&a&lFaites un clic droit à nouveau pour annuler la téléportation !"
      Teleport-Cancelled: "&c&lTéléportation annulée !"
  Spectator:
    Spectator-Menu-Name: "&8Téléporteur"
    Target-Player-Score: "&7Score : %score%"
    Settings-Menu:
      Item-Name: "&b&lParamètres du spectateur &7(Clic droit)"
      Inventory-Name: "&8Paramètres du spectateur"
      Speed-Name: "&aVitesse"
      No-Speed: "&aAucune vitesse"
      Enable-Night-Vision: "&aActiver la vision nocturne"
      Enable-Night-Vision-Lore:
        - "&7Cliquez pour activer la vision nocturne !"
      Disable-Night-Vision: "&cDésactiver la vision nocturne"
      Disable-Night-Vision-Lore:
        - "&7Cliquez pour désactiver la vision nocturne !"
      Hide-Spectators: "&cMasquer les spectateurs"
      Hide-Spectators-Message: "&cVous ne voyez désormais plus les autres spectateurs !"
      Hide-Spectators-Lore:
        - "&7Cliquez pour masquer les autres spectateurs !"
      Show-Spectators: "&aAfficher les spectateurs"
      Show-Spectators-Message: "&aVous pouvez désormais voir les autres spectateurs !"
      Show-Spectators-Lore:
        - "&7Cliquez pour afficher les autres spectateurs !"
  Messages:
    Lobby-Messages:
      Start-In: "&7La partie commence dans &b%number%&7 secondes !"
      Waiting-For-Players: "&cEn attente de joueurs... Il faut au moins %minplayers% joueurs pour commencer."
      Enough-Players-To-Start: "&7Nous avons suffisamment de joueurs. La partie va bientôt commencer !"
      Game-Started: "&7La partie a commencé ! Le premier joueur à atteindre 25 éliminations remporte la victoire !"
      Kicked-For-Premium-Slot: "&c%player% a été expulsé de la partie pour libérer une place à un joueur premium !"
      You-Were-Kicked-For-Premium-Slot: "&cVous avez été expulsé de la partie pour libérer une place à un joueur premium !"
    Join: "&b%player% &ea rejoint la partie &e(&b%players%&e/&b%maxplayers%&e) !"
    Leave: "&b%player% &ea quitté la partie &e(&b%players%&e/&b%maxplayers%&e)&7 !"
    Death: "&9%player% &ea été éliminé par &9%killer% !"
    Unknown-Death: "&9%player% &ea été tué par &ksomeoneunknown&7 !"
    Already-Force-Start: "&cLa partie est déjà en train de démarrer !"
    Kill-Streak:
      - "&9%killer% &een est à &b%kill_streak% &eéliminations consécutives !"
      - "&9%killer% &eest imbattable !"
