# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#                                                         #
#   Vous pouvez traduire les messages de One in the       #
#   Chamber ici.                                          #
#   Les codes couleurs (&) sont pris en charge.           #
#                                                         #
#   Utilisez \n pour créer une nouvelle ligne.            #
#   Certains messages sont automatiquement coupés         #
#   toutes les 40 caractères.                             #
#                                                         #
#   Certains messages possèdent leurs propres             #
#   variables comme %player%.                             #
#                                                         #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

Commands:
  Did-You-Mean: "&3Vouliez-vous dire &b%command%&3 ?"
  Correct-Usage: "&cUtilisation correcte : %usage%"
  Removed-Game-Instance: "&aInstance de jeu supprimée avec succès !"
  No-Arena-Like-That: "&cAucune arène correspondant à ce nom n'a été trouvée !"
  Type-Arena-Name: "&cVeuillez saisir un nom d'arène !"
  No-Free-Arenas: "&cAucune arène disponible !"
  Statistics:
    Type-Name: "&cVeuillez saisir le nom d'une statistique à consulter !"
    Invalid-Name: "&cNom de statistique invalide ! Types : kills, deaths, games_played, wins, loses, highest_score"
    Header: "&8&m-------------------[&6 Top 10 &8&m]-------------------"
    Format: "&e#%position% %name% - %value% &7%statistic%"
  Only-By-Player: "&cVous devez être un joueur pour exécuter cette commande !"
  Not-Playing: "&cVous devez être en jeu pour exécuter cette commande !"
  No-Permission: "&cVous n'avez pas la permission d'utiliser cette commande !"
  Leaderboard-Command:
    Empty-Entry: "Vide"
    Unknown-Entry: "Joueur inconnu"
  Admin-Commands:
    Teleported-To-Player: "&aTéléportation vers le joueur effectuée !"
    Player-Not-Found: "&cJoueur introuvable !"
    Success-Reload: "&aLe système, les configurations et les arènes ont été rechargés avec succès !"
    List-Command:
      Format: "&aArènes existantes : &7%list%"
      No-Arenas-Created: "&cAucune instance de jeu à afficher ! Pourquoi ne pas en créer une ?"
  Stats-Command:
    Header: "&l-----[VOS STATISTIQUES]-----"
    Header-Other: "&l-----[STATISTIQUES DE %player%]-----"
    Messages:
      - "%header%"
      - "&8 * &aÉliminations : &e%kills%"
      - "&8 * &aMorts : &e%deaths%"
      - "&8 * &aVictoires : &e%wins%"
      - "&8 * &aDéfaites : &e%loses%"
      - "&8 * &aMeilleur score : &e%highest_score%"
      - "&8 * &aParties jouées : &e%games_played%"
      - "&l----------------------"

# Messages du scoreboard en jeu.
# Ne dépassez pas 48 caractères sur les anciennes versions de Minecraft !
# Jusqu'à 144 caractères sont autorisés à partir de la version 1.14.

Scoreboard:
  Title: "&e&lOITC"
  Top-Player-Format: "&f%score% &6%player%"
  Content:
    Waiting:
      - ""
      - "&fCarte : &a%map_name%"
      - "&fJoueurs : &a%players%/%max_players%"
      - ""
      - "&fEn attente de joueurs..."
      - ""
      - "&epatreon.com/despical"
    Starting:
      - ""
      - "&fCarte : &a%map_name%"
      - "&fJoueurs : &a%players%/%max_players%"
      - ""
      - "&fDébut dans &a%formatted_time% &f!"
      - "&fTemps restant pour"
      - "&faccueillir d'autres joueurs"
      - ""
      - "&epatreon.com/despical"
    Playing:
      - ""
      - "%top_player_1%"
      - "%top_player_2%"
      - "%top_player_3%"
      - ""
      - "&fCarte : &e%map_name%"
      - "&fJoueurs : &6%players%"
      - "&fScore : &6%kills%"
      - ""
      - "&fTemps restant : &6%formatted_time%"
      - ""
      - "&epatreon.com/despical"

# Laissez un message vide pour masquer la barre dans un état spécifique de l'arène.

Game-Bar:
  Waiting-For-Players: "&e&lVOUS JOUEZ À &f&lONE IN THE CHAMBER &e&lPAR &b&lDespical"
  Starting: "&e&lVOUS JOUEZ À &f&lONE IN THE CHAMBER &e&lPAR &b&lDespical"
  In-Game: ""
  Ending: "&e&lVOUS JOUEZ À &f&lONE IN THE CHAMBER &e&lPAR &b&lDespical"

# Utilisé dans la plupart des messages du jeu.

In-Game:
  Plugin-Prefix: "&8[&6OITC&8] "
  Already-Playing: "&cVous êtes déjà dans la file d'attente d'une partie ! Utilisez /oitc leave pour la quitter."
  Join-No-Permission: "&cVous ne possédez pas la permission &6%permission% &cpour rejoindre cette arène !"
  Full-Game-No-Permission: "&cVous n'avez pas la permission de rejoindre les parties complètes !"
  No-Slots-For-Premium: "&cCette partie est déjà complète avec des joueurs premium ! Désolé."
  You-Are-Spectator: "&cVous êtes maintenant spectateur ! Vous pouvez voler !"
